{% extends 'tienda/base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="card shadow-sm p-4 w-50 mx-auto mt-4">
    <h2 class="mb-3">Editar Producto</h2>
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button type="submit" class="btn btn-primary mt-3 w-100">Actualizar Producto</button>
        <a href="{% url 'inventario' %}" class="btn btn-outline-secondary mt-2 w-100">Cancelar</a>
    </form>
</div>
{% endblock %}
