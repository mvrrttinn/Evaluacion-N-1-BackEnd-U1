<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Ventas</title>
    <!-- Integración de Bootstrap 5 mediante CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
        <div class="container">
            <a class="navbar-brand" href="#">Sistema de Ventas</a>
            <div class="navbar-nav">
                <!-- Los enlaces los conectaremos a las URLs -->
                <a class="nav-link" href="{% url 'inventario' %}">Inventario</a>
                <a class="nav-link" href="{% url 'registrar_venta' %}">Registrar Venta</a>
                <a class="nav-link" href="{% url 'historial_ventas' %}">Historial de Ventas</a>
            </div>
        </div>
    </nav>
    
    <div class="container">
        <!-- Bloque dinámico donde se inyectará el contenido de las otras pantallas -->
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
